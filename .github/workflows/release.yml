# Publishes to npm whenever main has a version that isn't on npm yet.
# Marketing's sync (scripts/sync-from-design-system.mjs) bumps the version and pushes; this does the rest.
#
# Publishing uses npm Trusted Publishing: the package's npm settings trust GitHub Actions in this repository
# with the workflow file "release.yml", so no password is stored. (If an NPM_TOKEN secret is set instead, it's used.)
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to tag the release
  id-token: write   # for npm Trusted Publishing (OIDC) and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest   # Trusted Publishing needs npm 11.5 or later
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Publish if this version is new
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm. Nothing to publish."
            exit 0
          fi
          # Trusted Publishing by default; a stored token only if one has been set up.
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc; fi
          npm publish --access public --provenance
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Published $NAME@$VERSION" >> "$GITHUB_STEP_SUMMARY"
